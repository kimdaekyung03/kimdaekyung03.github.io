### Skills [ skills ]
skills:
  title: "Professional Skills"
  subtitle: "my <b>Talent</b>"
  bg_title: "Skills"

  column1:
    items:
      - label: "LINUX" #0-10 progress in dots
        text: "Ubuntu 기반 서버 운영 및 CLI 환경 시스템 관리 역량 보유."
        value: "30" #0-100 progress in %

      - label: "Python" #0-10 progress in dots
        text: "Pandas 및 Flask를 활용한 데이터 처리 및 API 서버 구축 가능."
        value: "25" #0-100 progress in %

  column2:
    items:
      - label: "Packet Tracer" #0-10 progress in dots
        text: "L2/L3 스위칭 및 라우팅 시뮬레이션을 통한 네트워크 인프라 설계."
        value: "25" #0-100 progress in %

      - label: "Shell Script" #0-10 progress in dots
        text: "Bash 스크립팅을 이용한 로그 관리 및 시스템 작업 자동화 구현."
        value: "25" #0-100 progress in %

  column3:
    items:
      - label: "Iptables" #0-10 progress in dots
        text: "커널 방화벽 정책 수립 및 트래픽 필터링을 통한 네트워크 보안 설정."
        value: "50" #0-100 progress in %

      - label: "WordPress" #0-10 progress in dots
        text: "CMS 기반 웹 서비스 구축 및 DB 연동을 통한 콘텐츠 관리 운영."
        value: "50" #0-100 progress in %

### Resume [ resume ]
resume:
  title: "Resume"
  subtitle: "my <b>Story</b>"
  bg_title: "History"

  education:
    title: "학력"
    items:
      - name: "한국폴리텍대학 강서캠퍼스"
        subname: "사이버보안과"
        period: "2025 - <b>재학중</b>"
        text: "네트워크 보안, 시스템 보안, 데이터 베이스 기초 지식 등 사이버 보안의 기초 지식을 배우고 있습니다."

      - name: "운전면허 2종 보통"
        subname: "한국도로교통공단"
        period: "2020-07"
        text: "한국의 운전면허를 취득하였습니다."

      - name: "공동주택 IT 안전관리사 2급"
        subname: "한국 홈네트워크 안전관리협회"
        period: "2025-09-23"
        text: "공동주택의 IT 시스템에 대한 안전관리에 관한 자격증을 취득하였습니다."

  experience:
    title: "Experience"
    items:
      - name: "융합프로젝트"
        subname: "한국폴리텍대학 강서캠퍼스"
        period: "2026.03 - 2026.06"
        text: "랜섬웨어의 VSS스냅샷 삭제 공격을 방지하고 사용자의 데이터를 실시간으로 안전하게 보호하는 고성능 방어엔진(LIRS) 개발."


      - name: "춘계 종합학술대회 논문 발표"
        subname: "한국정보통신학회 2026년 춘계"
        period: "2026.04 - 2026.05"
        text: "WannaCry 랜섬웨어 : EternalBlue 취약점 분석 및 방어 전략 2026년 한국정보통신학회 춘계 종합학술대회 논문집 춘계 30권 1호 등재."

